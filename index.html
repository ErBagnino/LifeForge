<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>LifeForge</title>
    <meta name="description" content="LifeForge — your real life is the game. A personal life tycoon / RPG." />
    <meta name="application-name" content="LifeForge" />
    <meta name="apple-mobile-web-app-title" content="LifeForge" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#f4f4f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b10" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('lf-theme');
        var dark = t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        var a = localStorage.getItem('lf-accent');
        if (a) document.documentElement.dataset.accent = a;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>LifeForge needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
